services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: resaa-s-ui-docs:local
    restart: unless-stopped
    ports:
      - '${DOCS_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/docs/pages/introduction').then((r) => process.exit(r.status < 400 ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
